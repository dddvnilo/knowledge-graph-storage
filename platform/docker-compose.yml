services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ksplatform
      POSTGRES_USER: ksplatform
      POSTGRES_PASSWORD: ksplatform  # local development only
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Runs the test suite for now. Becomes the web application once the
  # framework (Django or FastAPI) is chosen.
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ksplatform:ksplatform@db:5432/ksplatform
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  db-data:
