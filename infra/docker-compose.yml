# Local Virtuoso triple store for ks-graph.
#
#   cd infra
#   cp .env.example .env        # then set a password in .env
#   docker compose up -d
#
# SPARQL endpoint:  http://localhost:8890/sparql
# Conductor (admin): http://localhost:8890/conductor   (user: dba)

services:
  virtuoso:
    image: openlink/virtuoso-opensource-7:7.2.17
    container_name: ks-graph-virtuoso
    restart: unless-stopped
    ports:
      - "${VIRTUOSO_HTTP_PORT:-8890}:8890"   # HTTP: SPARQL endpoint, Graph Store, Conductor
      - "${VIRTUOSO_ISQL_PORT:-1111}:1111"   # isql (SQL console)
    environment:
      # Password of the "dba" admin user. Must be set in .env before the first start;
      # it only takes effect when the database is created.
      DBA_PASSWORD: ${DBA_PASSWORD:?Set DBA_PASSWORD in infra/.env}
      # Max rows returned by the public SPARQL endpoint (Virtuoso default is 10000).
      VIRT_SPARQL_ResultSetMaxRows: ${VIRTUOSO_MAX_ROWS:-100000}
    volumes:
      # Database files live here, so data survives container restarts.
      # Delete this folder (with the container stopped) to start from an empty store.
      - ./virtuoso-data:/database
